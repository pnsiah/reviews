<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../static/logo.svg" type="image/x-icon">
  <!-- Font awesome link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=PT+Mono&display=swap"
    rel="stylesheet">
  <!-- http://getbootstrap.com/docs/5.3/ -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

  <title>CS50 Reviews: {% block title %}{% endblock %}</title>
</head>

<body>
  <header>
    <nav class="nav-bar">
      <div>
        <a href="{{url_for('home') }}"><img src="/static/logo.svg" alt=""></a>
      </div>
      <div class="menu-items">
        <li class=""><a class="" href="{{ url_for('home') }}"><img src="/static/menu.svg" alt="menu svg"></a></li>
        <li class=""><a class="" href="{{ url_for('movie') }}"><img src="{{ url_for('static',filename='film.svg') }}"
              alt="film"></a></li>
        <li class=""><a class="" href="{{ url_for('tv') }}"><img src="{{ url_for('static', filename='tv.svg') }}"
              alt="tv-series"></a></li>
        <li class="profile-pic"><a href="{{ url_for('profile') }}"><img class="account-img"
              src="{{ url_for('static', filename='profile_pictures/'+ (user_data.image_file or 'default.jpg')) }}"
              alt="Profile Pics"></a></li>
      </div>
      <div>
        <li class=""><a class="" href="{{ url_for('logout')}}">Log Out</a></li>
      </div>
    </nav>
  </header>
  <main class="main">
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-12">
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
          {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          {% endfor %}
          {% endif %}
          {% endwith %}
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.3.3/dist/js/bootstrap.min.js"
    integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
    crossorigin="anonymous"></script>
</body>

</html>
